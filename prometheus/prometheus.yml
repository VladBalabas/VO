global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: web
    dns_sd_configs:
      - names: [web]
        type: A
        port: 8000
        refresh_interval: 5s
    metrics_path: /metrics
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
