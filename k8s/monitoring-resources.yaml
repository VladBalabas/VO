apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: web
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["lab3"]
  selector:
    matchLabels:
      app: web
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: lab3
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      nodeSelector:
        role: infra
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: postgres-headless.lab3.svc.cluster.local:5432/referrals?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["lab3"]
  selector:
    matchLabels:
      app: postgres-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
