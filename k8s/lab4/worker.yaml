apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: lab4
data:
  POSTGRES_HOST: postgres-headless
  POSTGRES_PORT: "5432"
  WEB_URL: http://web:8000
  LEASE_SECONDS: "5"
  POLL_INTERVAL_MS: "100"
  FAIL_RATE: "0"
  CLAIM_MODE: skip_locked
  CLAIM_BATCH_SIZE: "1"
  IDEMPOTENT_RESULTS: "true"
  Q_LO: "0.05"
  Q_HI: "0.95"
  SLICE_SIZE: "256"
  METRICS_PORT: "9100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lab4
spec:
  selector:
    matchLabels: {app: worker}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: vo-worker:lab4
          imagePullPolicy: IfNotPresent
          ports:
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: worker-config}
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            - name: WORKER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources:
            requests: {cpu: 250m, memory: 96Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: lab4
spec:
  selector: {app: worker}
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}

